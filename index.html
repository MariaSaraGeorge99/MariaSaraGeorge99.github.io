<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#e8e9ed">
<title>Maria Sara George | Portfolio</title>
<meta name="description" content="Maria Sara George: IMCA student at Rajagiri College. Cybersecurity, product management and business analysis.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Manrope:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#e8e9ed; --ink:#1e2127; --muted:#5a606a; --line:rgba(30,33,40,.09);
  --glass:rgba(255,255,255,.55); --edge:rgba(255,255,255,.9);
  --lilac:#a9afba; --rose:#ffffff; --teal:#3a4048;
}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{font-family:Manrope,system-ui,sans-serif;color:var(--ink);background:var(--bg);line-height:1.65;min-height:100vh;overflow-x:hidden}
body::before,body::after{content:"";position:fixed;border-radius:50%;filter:blur(90px);z-index:-1;opacity:.7}
body::before{width:55vmax;height:55vmax;background:var(--lilac);top:-20vmax;left:-15vmax}
body::after{width:50vmax;height:50vmax;background:radial-gradient(#ffffff,#c4c8d0);bottom:-20vmax;right:-15vmax;opacity:.9}
a{color:inherit}
:focus-visible{outline:2px solid var(--teal);outline-offset:3px}

nav{position:sticky;top:14px;z-index:10;width:max-content;max-width:calc(100% - 24px);margin:14px auto 0;display:flex;gap:6px;padding:6px;border-radius:999px;background:var(--glass);border:1px solid var(--edge);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);overflow-x:auto}
nav a{padding:7px 14px;border-radius:999px;text-decoration:none;font-size:.9rem;color:var(--muted);white-space:nowrap;transition:background .2s,color .2s}
nav a:hover{background:rgba(255,255,255,.75);color:var(--ink)}

main{max-width:1060px;margin:0 auto;padding:0 20px 60px}
section{padding-top:72px}
h1,h2,h3{font-family:Fraunces,Georgia,serif;font-weight:600;line-height:1.15}
h2{font-size:clamp(1.8rem,4vw,2.4rem);margin-bottom:22px}

/* glass window */
.win{background:var(--glass);border:1px solid var(--edge);border-radius:20px;backdrop-filter:blur(22px) saturate(140%);-webkit-backdrop-filter:blur(22px) saturate(140%);box-shadow:0 0 0 1px var(--line),0 24px 60px rgba(50,56,70,.16),inset 0 1px 0 #fff;overflow:hidden}
.bar{display:flex;align-items:center;gap:7px;padding:11px 16px;border-bottom:1px solid var(--line);font-size:.82rem;color:var(--muted)}
.bar i{width:11px;height:11px;border-radius:50%;background:#b3b8c1}
.bar i:nth-child(2){background:#cdd0d6}.bar i:nth-child(3){background:#8b919c}
.bar span{margin-left:8px}
.body{padding:24px}

/* hero */
.hero{display:grid;grid-template-columns:1.1fr 1fr;gap:48px;align-items:center;min-height:84vh;padding-top:48px}
.hero h1{font-size:clamp(2.4rem,6vw,4rem);letter-spacing:-.02em;margin-bottom:16px}
.hero p{color:var(--muted);max-width:52ch}
.btns{display:flex;flex-wrap:wrap;gap:12px;margin-top:26px}
.btn{padding:11px 22px;border-radius:999px;text-decoration:none;font-weight:600;border:1px solid var(--line);background:var(--glass);transition:transform .2s,background .2s}
.btn:hover{transform:translateY(-2px);background:rgba(255,255,255,.9)}
.btn.main{background:#252930;border:0;color:#fff}
.btn.main:hover{background:#3a4048}
.portrait{position:relative;width:100%;max-width:430px;margin:0 auto;padding:10px 0 20px}
.frame{border-radius:30px}
.frame img{display:block;width:100%;aspect-ratio:4/5;object-fit:cover;object-position:center top}
.chip{position:absolute;padding:10px 18px;border-radius:16px;font-size:.9rem;font-weight:600;white-space:nowrap;line-height:1.35}
.chip small{display:block;font-weight:500;color:var(--muted);font-size:.76rem}
.c1{top:9%;left:-16%;animation:float 7s ease-in-out infinite}
.c2{bottom:24%;right:-14%;animation:float 8s ease-in-out -3s infinite}
.c3{bottom:3%;left:-8%;animation:float 9s ease-in-out -5s infinite}
@keyframes float{50%{transform:translateY(-12px)}}

/* grids */
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:20px}
.win h3{font-size:1.2rem;margin-bottom:8px}
.win p,.win li{color:var(--muted);font-size:.95rem}
ul{padding-left:18px}
.tags{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.tags span{padding:3px 12px;border-radius:999px;font-size:.8rem;background:rgba(255,255,255,.7);border:1px solid var(--line)}
.cert{display:flex;flex-direction:column;text-decoration:none;transition:transform .25s}
.cert:hover{transform:translateY(-4px)}
.cert img{width:100%;aspect-ratio:3/2;object-fit:cover;display:block;border-bottom:1px solid var(--line);background:#fff}
.cert .body{padding:18px 20px}
.cert small{color:var(--teal);font-weight:600}
.certs{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.posts{grid-template-columns:repeat(auto-fit,minmax(300px,1fr));align-items:start}
.post summary{list-style:none;cursor:pointer;padding:20px 22px;display:flex;flex-direction:column;gap:4px;transition:background .2s}
.
